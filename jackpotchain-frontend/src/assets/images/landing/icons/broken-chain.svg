<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64">
  <defs>
    <linearGradient id="gold-gradient-broken" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0B429;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- 연결선들 먼저 그리기 (블록보다 아래) -->

  <!-- 블록1 -> 블록3 (2개 연결) -->
  <line x1="32" y1="19" x2="90" y2="23" stroke="url(#gold-gradient-broken)" stroke-width="2" opacity="0.4"/>

  <!-- 블록1 -> 블록4 -->
  <line x1="26" y1="30" x2="120" y2="45" stroke="url(#gold-gradient-broken)" stroke-width="2" opacity="0.4"/>

  <!-- 블록2는 연결 없음 (0개) -->

  <!-- 블록3 -> 블록5 (3개 연결) -->
  <line x1="112" y1="20" x2="168" y2="18" stroke="url(#gold-gradient-broken)" stroke-width="2" opacity="0.4"/>

  <!-- 블록3 -> 블록2 -->
  <line x1="95" y1="34" x2="50" y2="38" stroke="url(#gold-gradient-broken)" stroke-width="2" opacity="0.4"/>

  <!-- 블록3 -> 블록4 -->
  <line x1="106" y1="34" x2="126" y2="40" stroke="url(#gold-gradient-broken)" stroke-width="2" opacity="0.5"/>

  <!-- 블록4 -> 블록5 (1개 연결) -->
  <line x1="142" y1="48" x2="172" y2="32" stroke="url(#gold-gradient-broken)" stroke-width="2" opacity="0.5"/>

  <!-- 블록5 -> 블록1 (2개 연결, 위에서 이미 1개) -->
  <line x1="168" y1="24" x2="32" y2="15" stroke="url(#gold-gradient-broken)" stroke-width="2" opacity="0.3"/>

  <!-- 블록들 (선 위에 그려짐) -->

  <!-- 블록 1 (왼쪽 위) - 2개 연결 -->
  <rect x="10" y="8" width="22" height="22" rx="4"
        fill="#0A0A0F" stroke="url(#gold-gradient-broken)" stroke-width="3" />

  <!-- 블록 2 (왼쪽 아래) - 0개 연결 (고립됨) -->
  <rect x="35" y="38" width="22" height="22" rx="4"
        fill="#0A0A0F" stroke="url(#gold-gradient-broken)" stroke-width="3" />

  <!-- 블록 3 (중앙 위) - 3개 연결 -->
  <rect x="90" y="12" width="22" height="22" rx="4"
        fill="#0A0A0F" stroke="url(#gold-gradient-broken)" stroke-width="3" />

  <!-- 블록 4 (중앙 아래) - 1개 연결 -->
  <rect x="120" y="40" width="22" height="22" rx="4"
        fill="#0A0A0F" stroke="url(#gold-gradient-broken)" stroke-width="3" />

  <!-- 블록 5 (오른쪽 위) - 2개 연결 -->
  <rect x="168" y="10" width="22" height="22" rx="4"
        fill="#0A0A0F" stroke="url(#gold-gradient-broken)" stroke-width="3" />
</svg>
