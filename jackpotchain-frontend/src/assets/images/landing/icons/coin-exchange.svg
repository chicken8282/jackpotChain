<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold-gradient-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0B429;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <!-- Left coin -->
  <circle cx="20" cy="28" r="10" fill="none" stroke="url(#gold-gradient-coin)" stroke-width="2"/>
  <text x="20" y="33" font-family="monospace" font-size="12" fill="url(#gold-gradient-coin)" text-anchor="middle">C</text>
  <!-- Right coin -->
  <circle cx="44" cy="36" r="10" fill="none" stroke="url(#gold-gradient-coin)" stroke-width="2"/>
  <text x="44" y="41" font-family="monospace" font-size="12" fill="url(#gold-gradient-coin)" text-anchor="middle">C</text>
  <!-- Exchange arrows -->
  <path d="M 28 24 L 38 24 L 36 22 M 38 24 L 36 26"
        fill="none" stroke="url(#gold-gradient-coin)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 36 40 L 26 40 L 28 38 M 26 40 L 28 42"
