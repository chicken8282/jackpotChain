<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0B429;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Simple chain: 3 connected blocks -->
  <rect x="6" y="26" width="14" height="14" rx="3"
        fill="none" stroke="url(#logo-gold)" stroke-width="2.5" />
  <rect x="25" y="26" width="14" height="14" rx="3"
        fill="none" stroke="url(#logo-gold)" stroke-width="2.5" />
  <rect x="44" y="26" width="14" height="14" rx="3"
        fill="none" stroke="url(#logo-gold)" stroke-width="2.5" />
  <!-- Connection lines -->
  <line x1="20" y1="33" x2="25" y2="33" stroke="url(#logo-gold)" stroke-width="2.5"/>
  <line x1="39" y1="33" x2="44" y2="33" stroke="url(#logo-gold)" stroke-width="2.5"/>
</svg>
