name: jackpotchain-dev

networks:
  dev-net:
    external: true
  monitoring-net:
    external: true

volumes:
  postgresql-dev-data:
  redis-dev-data:
  rabbitmq-dev-data:
  node-dev-data:
  node-dev-wallets:

services:
  postgresql-dev:
    image: postgres:16-alpine
    container_name: jc-postgresql-dev
    restart: unless-stopped
    networks:
      - dev-net
    env_file:
      - ../env/.env.dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgresql-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:7-alpine
    container_name: jc-redis-dev
    restart: unless-stopped
    networks:
      - dev-net
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 3

  rabbitmq-dev:
    image: rabbitmq:3-management-alpine
    container_name: jc-rabbitmq-dev
    restart: unless-stopped
    networks:
      - dev-net
    env_file:
      - ../env/.env.dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-dev-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  jackpotchain-node-dev:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_IMAGE_NODE}:${IMAGE_TAG}
    container_name: jc-node-dev
    restart: unless-stopped
    networks:
      - dev-net
      - monitoring-net
    env_file:
      - ../env/.env.dev
    environment:
      NODE_DATA_DIR: /data
      NODE_WALLET_FILE: /wallets/default.json
      NODE_RPC_HOST: 0.0.0.0
      NODE_RPC_PORT: "9776"
      NODE_P2P_PORT: "9777"
      NODE_RENDEZVOUS_PORT: "9778"
      NODE_SEED_NODE: "false"
      NODE_MINE: "false"
      NODE_MAX_INBOUND: "128"
      NODE_MAX_OUTBOUND: "16"
    expose:
      - "9776"
      - "9777"
      - "9778"
    volumes:
      - node-dev-data:/data
      - node-dev-wallets:/wallets
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf -X POST http://localhost:9776 -H ''Content-Type: application/json'' -d ''{"jsonrpc":"2.0","method":"getblockcount","id":1}'' || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  spring-dev:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_IMAGE_BE}:${IMAGE_TAG}
    container_name: jc-spring-dev
    restart: unless-stopped
    networks:
      - dev-net
      - monitoring-net
    env_file:
      - ../env/.env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgresql-dev:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis-dev
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq-dev
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JACKPOTCHAIN_RPC_URL: http://jackpotchain-node-dev:9776
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport"
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      postgresql-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      rabbitmq-dev:
        condition: service_healthy
      jackpotchain-node-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend-dev:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_IMAGE_FE}:${IMAGE_TAG}
    container_name: jc-frontend-dev
    restart: unless-stopped
    networks:
      - dev-net
    ports:
      - "127.0.0.1:8011:80"
    depends_on:
      spring-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
