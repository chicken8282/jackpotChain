name: jackpotchain-dev

networks:
  dev-net:
    external: true
  monitoring-net:
    external: true

volumes:
  postgresql-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  rabbitmq-dev-data:
    driver: local

services:
  postgresql-dev:
    image: postgres:16-alpine
    container_name: jc-postgresql-dev
    restart: unless-stopped
    networks:
      - dev-net
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${DB_NAME:-jackpotchain_dev}
      POSTGRES_USER: ${DB_USERNAME:-jackpot}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgresql-dev-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-jackpot} -d ${DB_NAME:-jackpotchain_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:7-alpine
    container_name: jc-redis-dev
    restart: unless-stopped
    networks:
      - dev-net
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 3

  rabbitmq-dev:
    image: rabbitmq:3-management-alpine
    container_name: jc-rabbitmq-dev
    restart: unless-stopped
    networks:
      - dev-net
    env_file:
      - .env.dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-dev-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  spring-dev:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_IMAGE_BE:-jackpotchain-be}:${IMAGE_TAG:-develop}
    container_name: jc-spring-dev
    restart: unless-stopped
    networks:
      - dev-net
      - monitoring-net
    env_file:
      - .env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgresql-dev:5432/${DB_NAME:-jackpotchain_dev}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis-dev
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq-dev
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JACKPOTCHAIN_RPC_URL: http://jackpotchain-node:8332
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport"
    ports:
      - "8082:8080"
    depends_on:
      postgresql-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      rabbitmq-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend-dev:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_IMAGE_FE:-jackpotchain-fe}:${IMAGE_TAG:-develop}
    container_name: jc-frontend-dev
    restart: unless-stopped
    networks:
      - dev-net
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
