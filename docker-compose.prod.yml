name: jackpotchain-prod

networks:
  prod-net:
    external: true
  dev-net:
    external: true
  monitoring-net:
    external: true

volumes:
  postgresql-prod-data:
    driver: local
  redis-prod-data:
    driver: local
  rabbitmq-prod-data:
    driver: local
  node-data:
    driver: local
    labels:
      backup: "required"
  node-wallets:
    driver: local
    labels:
      backup: "required"

services:
  postgresql:
    image: postgres:16-alpine
    container_name: jc-postgresql-prod
    restart: unless-stopped
    networks:
      - prod-net
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME:-jackpotchain}
      POSTGRES_USER: ${DB_USERNAME:-jackpot}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgresql-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jackpot} -d ${DB_NAME:-jackpotchain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jc-redis-prod
    restart: unless-stopped
    networks:
      - prod-net
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: jc-rabbitmq-prod
    restart: unless-stopped
    networks:
      - prod-net
    env_file:
      - .env.prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-prod-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  jackpotchain-node:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_IMAGE_NODE:-jackpotchain-node}:${IMAGE_TAG:-latest}
    container_name: jc-node
    restart: unless-stopped
    networks:
      - prod-net
      - dev-net
      - monitoring-net
    env_file:
      - .env.prod
    environment:
      NODE_DATA_DIR: /data
      NODE_WALLET_FILE: /wallets/default.json
      NODE_RPC_HOST: 0.0.0.0
      NODE_RPC_PORT: "8332"
      NODE_P2P_PORT: "8333"
    ports:
      - "8332:8332"
      - "8333:8333"
    volumes:
      - node-data:/data
      - node-wallets:/wallets
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -X POST http://localhost:8332 -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"getblockcount\",\"id\":1}' || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  spring-blue:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_IMAGE_BE:-jackpotchain-be}:${IMAGE_TAG:-latest}
    container_name: jc-spring-blue
    restart: unless-stopped
    networks:
      - prod-net
      - monitoring-net
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgresql:5432/${DB_NAME:-jackpotchain}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JACKPOTCHAIN_RPC_URL: http://jackpotchain-node:8332
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:+UseContainerSupport"
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jackpotchain-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  spring-green:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_IMAGE_BE:-jackpotchain-be}:${IMAGE_TAG:-latest}
    container_name: jc-spring-green
    restart: unless-stopped
    networks:
      - prod-net
      - monitoring-net
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgresql:5432/${DB_NAME:-jackpotchain}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JACKPOTCHAIN_RPC_URL: http://jackpotchain-node:8332
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:+UseContainerSupport"
    ports:
      - "8081:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jackpotchain-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend-prod:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_IMAGE_FE:-jackpotchain-fe}:${IMAGE_TAG:-latest}
    container_name: jc-frontend-prod
    restart: unless-stopped
    networks:
      - prod-net
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3