spring:
  config:
    import: optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/jackpotchain}}
    username: ${SPRING_DATASOURCE_USERNAME:${LOCAL_DB_USERNAME:jackpot}}
    password: ${SPRING_DATASOURCE_PASSWORD:${LOCAL_DB_PASSWORD:jackpot1234}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${LOCAL_REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${LOCAL_REDIS_PORT:6379}}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${LOCAL_RABBITMQ_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${LOCAL_RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${LOCAL_RABBITMQ_USERNAME:guest}}
    password: ${SPRING_RABBITMQ_PASSWORD:${LOCAL_RABBITMQ_PASSWORD:guest}}

jackpotchain:
  rpc:
    url: ${JACKPOTCHAIN_RPC_URL:${LOCAL_JACKPOTCHAIN_RPC_URL:http://localhost:8332}}

jwt:
  secret: ${JWT_SECRET:${LOCAL_JWT_SECRET:local-dev-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}}

auth:
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:13000,http://127.0.0.1:13000}
  refresh-cookie:
    secure: false
    same-site: Lax

logging:
  level:
    ssatto.BE_ssatto: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: ""
