spring:
  # 테스트 환경 — H2 인메모리 DB 사용 (PostgreSQL 대체)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop      # 테스트마다 스키마 재생성
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false               # 테스트 환경에서 Flyway 비활성화 (ddl-auto로 대체)

  # Redis 테스트 — 실제 Redis 없이 테스트하려면 @MockBean 사용
  data:
    redis:
      host: localhost
      port: 6379

  # RabbitMQ 테스트 — 실제 RabbitMQ 없이 테스트하려면 @MockBean 사용
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# JWT 테스트용 시크릿
jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256
  expiration: 86400000

# 테스트 로깅
logging:
  level:
    ssatto.jackpotchain: DEBUG
    org.hibernate.SQL: DEBUG
