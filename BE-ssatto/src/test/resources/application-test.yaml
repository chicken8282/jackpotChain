spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256
  expiration: 86400000

auth:
  challenge-ttl-seconds: 300
  cors:
    allowed-origins: http://localhost:3000
  refresh-cookie:
    path: /api/v1/auth
    max-age-seconds: 1209600
    secure: false
    same-site: Lax

jackpotchain:
  rpc:
    url: http://localhost:8332

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    ssatto.BE_ssatto: INFO
