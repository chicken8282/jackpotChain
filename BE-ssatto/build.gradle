plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ssatto'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot 핵심 스타터
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'     // Bean Validation (@Valid, @NotBlank 등)
	implementation 'org.springframework.boot:spring-boot-starter-security'       // Spring Security (JWT 인증)

	// Swagger (SpringDoc OpenAPI) — Swagger UI: /swagger-ui/index.html
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	// JWT 인증 토큰 처리
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// 데이터베이스 — 운영: PostgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway — DB 스키마 마이그레이션 관리
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Redis — 캐시 및 세션 관리
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// RabbitMQ — 비동기 이벤트 메시지 처리 (Outbox 패턴)
	implementation 'org.springframework.boot:spring-boot-starter-amqp'

	// Lombok — 보일러플레이트 코드 제거
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 테스트 의존성
	testImplementation 'org.springframework.boot:spring-boot-starter-test'      // JUnit 5 + Mockito + AssertJ
	testImplementation 'com.h2database:h2'                                       // 테스트용 인메모리 DB
	testImplementation 'org.springframework.security:spring-security-test'       // Spring Security 테스트 지원
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
