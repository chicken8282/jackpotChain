services:
  postgres:
    image: postgres:16-alpine
    container_name: jackpotchain-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: jackpotchain
      POSTGRES_USER: jackpot
      POSTGRES_PASSWORD: jackpot1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jackpot -d jackpotchain"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-local-data:
