apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-alerts
    receivers:
      - uid: discord-webhook
        type: discord
        settings:
          url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_URL_HERE"
          message: |
            {{ range .Alerts }}
            **[{{ .Labels.severity | toUpper }}] {{ .Annotations.summary }}**
            {{ .Annotations.description }}
            상태: {{ .Status }}
            {{ end }}
        disableResolveMessage: false
