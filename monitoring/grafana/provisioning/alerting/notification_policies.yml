apiVersion: 1

policies:
  - orgId: 1
    receiver: discord-alerts
    group_by: ["severity", "team"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
    routes:
      - matchers:
          - "severity=critical"
        receiver: discord-alerts
        group_wait: 10s
        repeat_interval: 30m
      - matchers:
          - "severity=warning"
        receiver: discord-alerts
        repeat_interval: 2h
