apiVersion: 1

policies:
  - orgId: 1
    receiver: discord-alerts          # 기본 수신처를 Discord로 설정
    group_by: ["severity", "team"]
    group_wait: 30s                   # 첫 알림까지 대기 (같은 그룹 묶기)
    group_interval: 5m                # 같은 그룹 재알림 간격
    repeat_interval: 1h               # 동일 알림 반복 주기
    routes:
      - matchers:
          - name: severity
            value: critical
        receiver: discord-alerts
        group_wait: 10s               # CRITICAL은 더 빠르게
        repeat_interval: 30m
      - matchers:
          - name: severity
            value: warning
        receiver: discord-alerts
        repeat_interval: 2h           # WARNING은 덜 자주
