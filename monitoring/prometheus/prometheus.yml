global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-dev'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['spring-dev:8080']

  - job_name: 'spring-blue'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['spring-blue:8080']

  - job_name: 'spring-green'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['spring-green:8080']